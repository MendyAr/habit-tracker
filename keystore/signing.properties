# Public "sideload" signing key for APKs published on GitHub Releases.
# It is intentionally committed so every release is signed with the same certificate
# and installs as an update over the previous one. It is NOT secret: anyone can sign
# with it. To use a private key, set the SIGNING_* environment variables / CI secrets
# instead (see docs/RELEASING.md); they take precedence over this file.
storeFile=keystore/sideload.jks
storePassword=habittracker
keyAlias=habittracker
keyPassword=habittracker
