name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease

      - name: Name APKs
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/HabitTracker-v${version}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/HabitTracker-v${version}-build${GITHUB_RUN_NUMBER}-debug.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apk-build-${{ github.run_number }}
          path: dist/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-build-${{ github.run_number }}
          path: |
            app/build/reports/
            core/build/reports/

  device-tests:
    name: Device tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 21 # Android 5.0, the oldest supported version
            target: default
            profile: Nexus 5
          - api-level: 29 # Android 10
            target: default
            profile: pixel_3a
          - api-level: 35 # Android 15
            target: google_apis
            profile: pixel_6
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/device-tests.sh

      - name: Print screenshots to the log
        if: always()
        run: |
          # Base64-encoded between markers, for reviewers who cannot download artifacts.
          find screenshots -name '*.png' | sort | while read -r f; do
            echo "=====SHOT $(basename "$f" .png)"
            base64 -w 0 "$f"
            echo
            echo "=====END"
          done

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-api${{ matrix.api-level }}-build${{ github.run_number }}
          path: |
            screenshots/
            instrument.log
