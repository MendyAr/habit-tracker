name: Release

# Publishes a signed, versioned APK as a GitHub release once CI (build, unit
# tests, lint and device tests) has passed on the default branch and its
# VERSION_NAME (gradle.properties) has no release yet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "name=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Release v${version} already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        if: steps.version.outputs.exists == 'false'

      # Optional private key. Without these secrets the repository's public
      # sideload key (keystore/) is used, see docs/RELEASING.md.
      - name: Use private signing key
        if: steps.version.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Test and build release APK
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature and prepare assets
        if: steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.name }}"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/HabitTracker-v${version}.apk"
          (cd dist && sha256sum "HabitTracker-v${version}.apk" > "HabitTracker-v${version}.apk.sha256")
          # Release notes: the CHANGELOG section of this version.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > dist/notes.md
          cat docs/release-footer.md >> dist/notes.md

      - name: Publish GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.name }}"
          gh release create "v${version}" \
            "dist/HabitTracker-v${version}.apk" \
            "dist/HabitTracker-v${version}.apk.sha256" \
            --target "$RELEASE_SHA" \
            --title "Habit Tracker v${version}" \
            --notes-file dist/notes.md \
            --latest
